<path d="M0,0 L10,5 L0,10 z" fill="#7C5CFF"/></marker></defs><rect x="1" y="1" width="438" height="306" rx="16" fill="url(#bg)" stroke="url(#g)" stroke-width="1.5"/><text x="24" y="40" font-size="17" font-weight="700" fill="url(#g)">AI-doc-Chatbot</text><text x="24" y="60" font-size="11" fill="#8a93b8">RAG · LLM · Vector Search</text><line x1="24" y1="74" x2="416" y2="74" stroke="#7C5CFF" stroke-opacity="0.35"/><rect x="24" y="88" width="3" height="46" rx="1.5" fill="#00C2FF"/><text x="36" y="98" font-size="10" font-weight="700" letter-spacing="2" fill="#00C2FF">PROBLEM</text><text x="36" y="116" font-size="12" fill="#e8ecff">Finding answers inside long documents is slow and</text><text x="36" y="132" font-size="12" fill="#e8ecff">manual.</text><rect x="24" y="158" width="3" height="46" rx="1.5" fill="#7C5CFF"/><text x="36" y="168" font-size="10" font-weight="700" letter-spacing="2" fill="#7C5CFF">APPROACH</text><text x="36" y="186" font-size="12" fill="#e8ecff">Chunk, embed and retrieve relevant passages, then</text><text x="36" y="202" font-size="12" fill="#e8ecff">let the LLM answer from them.</text><rect x="24" y="228" width="3" height="46" rx="1.5" fill="#FF4FD8"/><text x="36" y="238" font-size="10" font-weight="700" letter-spacing="2" fill="#FF4FD8">RESULT</text><text x="36" y="256" font-size="12" fill="#e8ecff">Answers grounded in the source document instead of</text><text x="36" y="272" font-size="12" fill="#e8ecff">guesses.</text></svg>